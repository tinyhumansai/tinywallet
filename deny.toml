# cargo-deny configuration — run locally with `cargo deny check all`.
# CI runs the same check in the "Supply chain" job of .github/workflows/ci.yml.

[graph]
all-features = true

[advisories]
# Fail on any crate with a security advisory or an unmaintained warning.
# Add an entry here only with a comment explaining the exposure and the plan.
ignore = []

[licenses]
# Licenses accepted for this crate and its dependencies. Keep GPL-3.0-only for
# the template crate itself; the remaining entries cover compatible dependency
# licenses commonly encountered by Rust projects.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # The rust-bitcoin family (`bitcoin`, `base58ck`, `bitcoin_hashes`,
    # `secp256k1`, `hex-conservative`, …) are CC0-1.0 — a public-domain
    # dedication, permissive and GPL-compatible.
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    # The MIT + no-false-attributions license (`hex_lit`, a rust-bitcoin
    # helper). Same permissiveness as MIT with the attribution clause dropped.
    "MITNFA",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions bloat build times; review them rather than ignoring them.
multiple-versions = "warn"
wildcards = "deny"
# ...except a path dependency on a sibling in this workspace. Both members are
# `publish = false`, so there is no registry copy a version requirement could
# ever select, and pinning one would only give the release workflow's version
# bump a second manifest to keep in step — a minor bump against a stale
# `version = "0.4.0"` fails resolution rather than resolving to the sibling.
allow-wildcard-paths = true
# Crates that must never enter the dependency graph.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `tinytools` is a git dependency of `tinywallet-x402` and `tinywallet-web3` (the
# `tools` features), by rev, so a host that already links it can patch this exact
# URL to its own copy. Nothing else may come from git.
allow-git = ["https://github.com/tinyhumansai/tinytools"]
