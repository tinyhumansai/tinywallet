name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@7f9ae5b5f2ddeb953fca5be7cc7cc1e4ef1c8555
    with:
      coverage-script: scripts/check-coverage.sh
      msrv-build-targets: |
        [
          {"packages":["tinywallet","tinywallet-crypto","tinywallet-bus"],"all_targets":true,"all_features":true},
          {"packages":["tinywallet-x402"],"features":["wire","eip712","abi","ledger"],"all_targets":true,"no_default_features":true},
          {"packages":["tinywallet-web3"],"all_targets":true}
        ]
      module-e2e-script: scripts/test-e2e.sh
      module-e2e-toolchain: '1.88.0'
      feature-test-script: scripts/test-features.sh

  wallet-dependency-boundaries:
    name: Wallet dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      - name: Host-linked crates pull no signing stack
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(cargo tree -e normal -i bitcoin -p tinywallet --all-features 2>/dev/null)" ]; then
            echo "control failed: tinywallet no longer depends on bitcoin" >&2
            exit 1
          fi
          for crate in tinywallet-crypto tinywallet-x402 tinywallet-bus tinywallet-web3; do
            for dep in bitcoin k256 coins-bip32 coins-bip39; do
              if [ -n "$(cargo tree -e normal -i "$dep" -p "$crate" --all-features 2>/dev/null)" ]; then
                echo "$crate depends on $dep; it must stay signing-free" >&2
                exit 1
              fi
            done
          done
      - name: Rail-neutral web3 modules name no chain
        shell: bash
        run: |
          set -uo pipefail
          if grep -rnE 'tinywallet_crypto|WalletChain|EvmNetwork' crates/tinywallet-web3/src/quote crates/tinywallet-web3/src/seams; then
            echo "quote/ and seams/ must stay free of crypto vocabulary" >&2
            exit 1
          fi
