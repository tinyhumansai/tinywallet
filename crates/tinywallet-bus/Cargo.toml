[package]
name = "tinywallet-bus"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "The TinyBus wire contract for TinyWallet: member names, payload types, address rules, and contract version."
repository = "https://github.com/tinyhumansai/tinywallet"
readme = "../../README.md"
# Same reasoning as the root crate: hosts take this repository as a git
# submodule, so a registry upload would be a third distribution channel nobody
# reads.
publish = false

# Deliberately transport-free and chain-library-free: a host only needs this
# vocabulary and these pure rules to call the dynamic module, not TinyBus, a
# runtime, or a signing stack. Every dependency here is a hash, a codec, or
# serde — nothing that builds native code.
[dependencies]
# Derive macros for the crate-wide error type in `src/error/mod.rs`.
thiserror = "2"
# Base58 (Solana) and base58check (Tron) address decoding. `check` brings in
# the checksum variant Tron addresses require.
bs58 = { version = "0.5", features = ["check"], optional = true }
# Hex codec for the Tron hex-address form the TronGrid API speaks.
hex = { version = "0.4", optional = true }
# bech32/bech32m segwit address encoding and decoding, checksum variant
# selection and witness-program length rules included. This is what lets a host
# validate a Bitcoin address without the `bitcoin` crate's native secp256k1
# build; see `src/address/btc.rs`.
bech32 = { version = "0.12", optional = true }
# RIPEMD-160, the second half of Bitcoin's HASH160. Feeds a `Sha256` (sha2
# 0.11) output, so the two must sit on the same `digest` line — hence 0.2.
ripemd = { version = "0.2", optional = true }
# SHA-256: Bitcoin's HASH160, Tron's base58check checksum, and the Tron txid.
sha2 = { version = "0.11", optional = true }
# Keccak-256, the hash EIP-55 checksums and EIP-712 struct hashes are defined
# over.
#
# PINNED TO 0.10, and not by accident — do not let dependabot move it. The root
# crate's `coins-bip32` line depends on `sha3` 0.10 and is not going to move, so
# 0.10 is already in the graph of any consumer that also takes the root crate
# with `key`. Asking for 0.12 here does not replace it, it ADDS a second copy.
sha3 = { version = "0.12", optional = true }
# Async trait methods for the `Transport` seam in `src/rpc/`. Rust cannot yet
# express an object-safe async trait natively, and `Transport` must be
# `dyn`-compatible because chain code takes `&dyn Transport`.
async-trait = { version = "0.1", optional = true }
# The `Transport` seam moves JSON payloads across the host boundary.
serde_json = { version = "1", optional = true }
# The wire payloads are encoded into TinyBus JSON frames.
serde = { version = "1", optional = true }

[dev-dependencies]
# Drives the async `Transport` tests. The crate itself pulls in no runtime —
# picking one is the host's call, so it is a dev-dependency only.
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["btc", "evm", "solana", "tron", "keccak", "net", "asset", "wire", "eip712", "abi", "tx-codec"]
# Bitcoin address parsing and validation. Dependency-light on purpose: base58
# via `bs58` (already here for Solana and Tron) and segwit via `bech32`.
btc = ["dep:bs58", "dep:bech32", "dep:ripemd", "dep:sha2"]
# Serde derives on the crate's core types (today `Chain`). A named gate rather
# than relying on `dep:serde` being implied, because `#[cfg(feature = "serde")]`
# on the enum has to name something that actually exists.
serde = ["dep:serde", "serde/derive"]
# EVM address validation. Dependency-free: an EVM address is 20 hex-encoded
# bytes, so the whole format is spelled out in `src/address/evm.rs`.
evm = []
# Solana base58 address validation.
solana = ["dep:bs58"]
# Tron base58check address validation and hex conversion.
tron = ["dep:bs58", "dep:hex"]
# EIP-55 mixed-case checksum support for EVM addresses.
keccak = ["evm", "dep:sha3"]
# The `Transport` network seam (`tinywallet_bus::rpc`). Everything else in the
# crate is a pure function; this is the one module that models I/O, and it still
# performs none itself — the host supplies the implementation.
net = ["dep:async-trait", "dep:serde_json", "dep:serde"]
# Network and token reference data. Pure tables; the tests cross-check every
# contract address against the address validators, so it needs every chain gate.
asset = ["btc", "evm", "solana", "tron"]
# The host/module wire contract (`tinywallet_bus::wire`). Deliberately outside
# every chain gate and dependency-free beyond serde.
wire = ["serde"]
# EIP-712 typed-data hashing and the EIP-3009 authorization x402 signs. Pure
# keccak over a fixed byte layout — no chain client, no bignum, no signer.
eip712 = ["dep:sha3"]
# ERC-20 `transfer` calldata. Outside the transaction gates because calldata is
# an input to building a transaction, so a host that builds elsewhere still
# needs it — and should not pay a bus round trip for keccak over 68 bytes.
abi = ["evm", "keccak", "eip712"]
# The half of transaction handling that reads and checks bytes rather than
# producing signatures: `tx::proto` (the structural protobuf reader) and the
# verification half of `tx::tron`.
tx-codec = ["dep:sha2", "wire"]

[lints]
workspace = true
