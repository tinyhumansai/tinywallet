[package]
name = "tinywallet-bus"
version = "0.7.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "The TinyBus wire contract for TinyWallet: member names, payload types, and contract version."
repository = "https://github.com/tinyhumansai/tinywallet"
readme = "README.md"
# Same reasoning as the root crate: hosts take this repository as a git
# submodule, so a registry upload would be a third distribution channel nobody
# reads.
publish = false

# Contract-only: names, version and the wire payload types. The chain rules that
# used to live here are in `tinywallet-crypto` and `tinywallet-x402`; this crate
# re-exports them for one release so existing paths keep resolving. It must
# never enable anything heavier than the features below (no `bitcoin`, `k256`,
# `coins-*`); CI asserts that.
[dependencies]
# Chain, address and transaction-verification rules, and the `Transport` seam.
# Default features off: each bus feature below forwards exactly the gate it
# always meant.
tinywallet-crypto = { path = "../tinywallet-crypto", default-features = false }
# `eip712` and `abi`, re-exported for compatibility. Default features off, so
# the x402 wire types and any future heavier feature (payment execution,
# ledger, tools) never reach a host that only takes the bus.
tinywallet-x402 = { path = "../tinywallet-x402", default-features = false, optional = true }
# The wire payloads are encoded into TinyBus JSON frames.
serde = { version = "1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["btc", "evm", "solana", "tron", "keccak", "net", "asset", "wire", "eip712", "abi", "tx-codec"]
# Every gate below forwards to the crate that owns the module now. The names are
# unchanged on purpose, so a downstream `features = [...]` list keeps working.
#
# Bitcoin address parsing and validation.
btc = ["tinywallet-crypto/btc"]
# Serde derives on the crate's core types (today `Chain`).
serde = ["dep:serde", "serde/derive", "tinywallet-crypto/serde"]
# EVM address validation.
evm = ["tinywallet-crypto/evm"]
# Solana base58 address validation.
solana = ["tinywallet-crypto/solana"]
# Tron base58check address validation and hex conversion.
tron = ["tinywallet-crypto/tron"]
# EIP-55 mixed-case checksum support for EVM addresses.
keccak = ["tinywallet-crypto/keccak"]
# The `Transport` network seam (`tinywallet_bus::rpc`).
net = ["tinywallet-crypto/net"]
# Network and token reference data.
asset = ["tinywallet-crypto/asset"]
# The host/module wire contract (`tinywallet_bus::wire`).
wire = ["serde"]
# EIP-712 typed-data hashing (`tinywallet-x402/eip712`).
eip712 = ["dep:tinywallet-x402", "tinywallet-x402/eip712"]
# ERC-20 `transfer` calldata (`tinywallet-x402/abi`).
abi = ["eip712", "tinywallet-x402/abi"]
# The Tron protobuf reader and verification half (`tinywallet_bus::tx`).
tx-codec = ["tinywallet-crypto/tx-codec", "wire"]

[lints]
workspace = true
