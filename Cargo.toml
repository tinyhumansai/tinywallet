[package]
name = "tinywallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Agent-friendly multi-chain wallet primitives in Rust."
repository = "https://github.com/tinyhumansai/tinywallet"
documentation = "https://docs.rs/tinywallet"
readme = "README.md"
keywords = ["wallet", "bitcoin", "solana", "ethereum", "tron"]
categories = ["cryptography::cryptocurrencies"]
# Keep the published package to what a consumer actually needs.
exclude = [
    ".github/",
    ".gitmodules",
    "docs/",
    "vendor/",
    "worktrees/",
    ".env.example",
    "deny.toml",
]

[workspace]
members = ["crates/tinywallet-module"]
default-members = [".", "crates/tinywallet-module"]
# The vendored bus is a submodule with its own workspace; it must not be pulled
# into this one.
exclude = ["vendor/tinybus"]
resolver = "3"

[dependencies]
# Derive macros for the crate-wide error type in `src/error/mod.rs`. Every
# dependency entry should carry a comment like this one saying why it is here.
thiserror = "2"
# Base58 (Solana) and base58check (Tron) address decoding. `check` brings in
# the checksum variant Tron addresses require.
bs58 = { version = "0.5", features = ["check"], optional = true }
# Hex codec for the Tron hex-address form the TronGrid API speaks.
hex = { version = "0.4", optional = true }
# PSBT construction and signing for Bitcoin (`src/tx/btc.rs`) — the one place
# a full Bitcoin implementation is still worth its weight. Deliberately NOT
# used for address parsing or key derivation any more: it carries `secp256k1`
# and therefore a native C build, which every consumer paid for even when all
# it wanted was to check an address. See `src/address/btc.rs` for why parsing
# is now owned directly and derivation still is not.
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"], optional = true }
# bech32/bech32m segwit address encoding and decoding, checksum variant
# selection and witness-program length rules included. Replaces the parsing
# half of what `bitcoin` used to do here.
bech32 = { version = "0.11", optional = true }
# RIPEMD-160, the second half of Bitcoin's HASH160. Only needed to turn a
# public key into a P2WPKH witness program.
ripemd = { version = "0.1", optional = true }
# BIP-32 on secp256k1, backed by the pure-Rust `k256` rather than the
# `secp256k1` C library. Deriving a key wrong is silent and unrecoverable, so
# this stays delegated to a vetted implementation — see `src/key/bip32.rs`.
# Already in the graph beneath `coins-bip39`, so it costs nothing.
coins-bip32 = { version = "0.8", optional = true }
# Keccak-256, the hash EIP-55 checksums are defined over. Only needed for the
# EVM checksum helpers, so it rides its own gate rather than `evm`'s — the
# common case (validate an address) stays dependency-free.
sha3 = { version = "0.10", optional = true }
# Async trait methods for the `Transport` seam in `src/rpc/`. Rust cannot yet
# express an object-safe async trait natively, and `Transport` must be
# `dyn`-compatible because chain code takes `&dyn Transport`.
async-trait = { version = "0.1", optional = true }
# BIP-39 mnemonic -> seed. Pinned to the same 0.8 line OpenHuman used before
# this extraction, so a wallet derived by the old code derives identically here.
coins-bip39 = { version = "0.8", optional = true }
# HMAC-SHA512, the whole of SLIP-0010's ed25519 derivation.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
# ed25519 signing keys for Solana.
ed25519-dalek = { version = "2", default-features = false, features = ["std"], optional = true }
# Wipes derived key material on drop rather than leaving it in freed memory.
zeroize = { version = "1", optional = true }
# The `Transport` seam moves JSON payloads across the host boundary; the chain
# modules build params and read results as `Value`.
serde_json = { version = "1", optional = true }
# `DeserializeOwned`, the bound on `rpc::decode`. No derives are needed here -
# the chain modules own their own response types - so the `derive` feature is
# deliberately left off.
serde = { version = "1", optional = true }

[dev-dependencies]
# Drives the async `Transport` tests. The crate itself pulls in no runtime -
# picking one is the host's call, so it is a dev-dependency only.
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The example and the public-API tests exercise every chain, so they only
# build with the full default set. Without this, a `--no-default-features`
# check fails on those targets rather than reporting the real question: does
# the library itself still compile with the gates off.
[[example]]
name = "basic"
required-features = ["btc", "evm", "solana", "tron", "keccak"]

[[test]]
name = "public_api"
required-features = ["btc", "evm", "solana", "tron", "keccak"]

[features]
default = ["btc", "evm", "solana", "tron", "keccak", "net", "key", "asset", "client", "tx", "x402", "wire", "eip712", "abi"]
# Bitcoin address parsing and validation. Dependency-light on purpose: base58
# via `bs58` (already here for Solana and Tron) and segwit via `bech32`. The
# `bitcoin` crate is deliberately NOT pulled in by this gate — only by `tx`,
# which needs a full PSBT implementation. That split is what lets a host
# validate addresses and derive keys without a native secp256k1 C build.
btc = ["dep:bs58", "dep:bech32", "dep:ripemd", "dep:sha2"]
# Serde derives on the crate's core types (today `Chain`). A named gate rather
# than relying on `dep:serde` being implied, because `#[cfg(feature = "serde")]`
# on the enum has to name something that actually exists.
# `serde/derive` is required, not incidental: `Chain` uses the derive macros.
# A local `cargo check --features serde` passes without it only because the
# dev-dependency on `serde` with `derive` unifies the feature in — a downstream
# consumer taking this crate with `serde` alone gets no derive and fails.
serde = ["dep:serde", "serde/derive"]
# EVM (Ethereum and compatible chains) address validation. Dependency-free:
# an EVM address is 20 hex-encoded bytes, so the whole format is spelled out
# in `src/address/evm.rs` rather than pulling in a chain client for it.
evm = []
# Solana base58 address validation.
solana = ["dep:bs58"]
# Tron base58check address validation and hex conversion.
tron = ["dep:bs58", "dep:hex"]
# EIP-55 mixed-case checksum support for EVM addresses.
keccak = ["evm", "dep:sha3"]
# The `Transport` network seam (`tinywallet::rpc`). Everything else in the
# crate is a pure function; this is the one module that models I/O, and it
# still performs none itself - the host supplies the implementation.
net = ["dep:async-trait", "dep:serde_json", "dep:serde"]
# Network and token reference data (`tinywallet::asset`). Pure tables; the
# tests cross-check every contract address against the address validators, so
# it needs every chain gate.
asset = ["btc", "evm", "solana", "tron"]
# Chain queries over the `Transport` seam (`tinywallet::client`). Needs the
# seam plus the reference data that names the networks.
client = ["net", "asset", "tx", "serde/derive"]
# EIP-712 typed-data hashing (`tinywallet::eip712`) and the EIP-3009
# authorization x402 signs. Pure keccak over a fixed byte layout — no chain
# client, no bignum, no signer — so the payment path costs `sha3` and nothing
# else. This is the gate that lets a host drop `ethers-core` entirely.
eip712 = ["dep:sha3"]
# ERC-20 `transfer` calldata (`tinywallet::abi`). Outside `tx` because calldata
# is an input to building a transaction, so a host that builds elsewhere still
# needs it — and should not pay a bus round trip for keccak over 68 bytes.
abi = ["evm", "keccak", "eip712"]
x402 = ["dep:serde", "dep:serde_json", "serde/derive", "eip712"]
# The host/backend wire contract (`tinywallet::wire`). Deliberately outside
# every chain gate and dependency-free beyond serde, so a host that has moved
# transaction building into a loadable module can take this crate with
# `default-features = false`, share one definition of the contract, and link no
# chain library at all. Same carve-out `tinydocs::spec` makes.
wire = ["serde"]
# Transaction building and signing (`tinywallet::tx`). This is the only gate
# that pulls the `bitcoin` crate, for PSBT construction and secp256k1
# recoverable signing. Everything else — addresses, derivation, reference data
# — is deliberately reachable without it, so a host that has moved signing into
# a loadable module sheds `bitcoin` and its native build entirely.
tx = [
    "btc",
    "evm",
    "keccak",
    "solana",
    "tron",
    "key",
    "dep:bitcoin",
    "dep:ed25519-dalek",
    "dep:bs58",
    "dep:sha2",
    "dep:hex",
]
# Deterministic key derivation from a BIP-39 mnemonic (`tinywallet::key`).
# Needs every chain gate it derives for; `keccak` covers the EVM/Tron address
# hash and `coins-bip32` the secp256k1 BIP-32 walk the three curve-sharing
# chains share. `btc` is here for the P2WPKH address encoding, which is now
# bech32 rather than the `bitcoin` crate.
key = [
    "dep:coins-bip39",
    "dep:coins-bip32",
    "dep:hmac",
    "dep:sha2",
    "dep:ed25519-dalek",
    "dep:zeroize",
    "btc",
    "keccak",
]

# Lints are defined at the workspace level and inherited by every member, so
# the module crate is held to exactly the same bar as the library. CI runs
# clippy with `-D warnings`, so anything set to "warn" here fails the build.
[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
